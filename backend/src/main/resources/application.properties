server.port=8080
server.servlet.context-path=/

spring.application.name=hotel-system

# ---------- 数据库 ----------
# 账号口令一律通过环境变量注入，仓库中不保存任何真实口令
spring.datasource.url=${HOTEL_DB_URL:jdbc:mysql://localhost:3306/hotel_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${HOTEL_DB_USER:root}
spring.datasource.password=${HOTEL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ---------- JSON ----------
spring.jackson.default-property-inclusion=non_empty
spring.jackson.time-zone=Asia/Shanghai

# ---------- 上传限制 ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- AI 模型配置 ----------
# 密钥一律通过环境变量注入，禁止写死在代码或配置文件里
ai.enabled=${HOTEL_AI_ENABLED:true}
ai.provider=${HOTEL_AI_PROVIDER:deepseek}
ai.base-url=${HOTEL_AI_BASE_URL:https://api.deepseek.com}
ai.chat-path=${HOTEL_AI_CHAT_PATH:/chat/completions}
ai.api-key=${HOTEL_AI_API_KEY:}
ai.model=${HOTEL_AI_MODEL:deepseek-chat}
ai.connect-timeout-ms=5000
ai.read-timeout-ms=60000
ai.max-retries=2
ai.retry-backoff-ms=800
# 每分钟最多调用次数（限流），以及单次上下文最大字符数
ai.rate-limit-per-minute=20
ai.max-context-chars=12000
ai.max-output-tokens=1500
ai.temperature=0.3
# 成本控制：每 1000 token 单价（分），仅用于估算展示
ai.prompt-price-cents-per-1k=0
ai.output-price-cents-per-1k=0
ai.agent-max-steps=4
ai.prompt-version=v1.0

# ---------- RAG ----------
rag.chunk-size=220
rag.chunk-overlap=40
rag.top-k=4
rag.score-threshold=0.08
rag.reindex-on-startup=true

logging.level.root=INFO
logging.level.com.cqucc.hotel=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
